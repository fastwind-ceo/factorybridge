name: Deploy FactoryBridge to VPS
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment label
        required: true
        default: production
  push:
    branches: [ main ]
concurrency:
  group: factorybridge-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
  deploy:
    needs: backend-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/factorybridge_deploy_key
          chmod 600 ~/.ssh/factorybridge_deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/factorybridge_deploy_key "${VPS_USER}@${VPS_HOST}" \
            "APP_DIR='${VPS_APP_DIR:-/opt/factorybridge}' REPO='https://github.com/${GITHUB_REPOSITORY}.git' BRANCH='${GITHUB_REF_NAME}' bash -s" \
            < scripts/github/deploy_from_git.sh
