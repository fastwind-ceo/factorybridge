name: FactoryBridge CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate OpenAPI
        run: |
          python - <<'PY'
          from app.main import app
          schema = app.openapi()
          assert schema.get('paths'), 'OpenAPI paths are empty'
          print(f"OpenAPI paths: {len(schema['paths'])}")
          PY
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: NEXT_TELEMETRY_DISABLED=1 npm run build
  static-deployment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required deployment files
        run: |
          test -f infra/docker-compose.prod.yml
          test -f infra/nginx/factorybridge.prod.conf
          test -f infra/env/backend.prod.env.example
          test -f infra/env/frontend.prod.env.example
          test -f infra/env/postgres.prod.env.example
          test -f docs/DEPLOYMENT_GUIDE.md
          test -f scripts/github/server_bootstrap_ubuntu.sh
          test -f scripts/github/deploy_from_git.sh
