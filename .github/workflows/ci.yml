name: FactoryBridge CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest || true

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean frontend environment
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Install frontend dependencies
        run: |
          npm install
          npm install next react react-dom

      - name: Verify Next.js installation
        run: |
          test -f node_modules/.bin/next
          npx next --version

      - name: Build frontend
        run: npx next build

  static-deployment-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -d frontend
          test -d backend